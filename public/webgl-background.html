<!--
  vs-aurora — raymarched aurora curtains over a spruce shore and a still lake that mirrors them.
  Three folding curtains live in a real volume: each is a thin vertical sheet along a curve that
  drifts and folds, with a sharp lower hem, fine rays of different lengths shimmering along it,
  and a fringe of a second colour at its foot. Every frame a tiny pass bakes the curtains' shape
  into a 1D texture, then a jittered march through the sky integrates them (edge-on folds come out
  bright, as they do in the real thing) and a temporal blend removes the grain. It is composited
  over stars, a faint Milky Way, far hills, a treeline and a lake with a Fresnel mirror and a slow
  ripple; graded and dithered so the gradients never band. The pointer pans the sky, on a spring.

  Fills its nearest positioned parent (position:absolute; inset:0). Put content above it.
  CSS variables (set on .vs-aurora):
    --vs-aurora-low        colour of the bright lower curtain (default green)
    --vs-aurora-high       colour the rays turn as they climb
    --vs-aurora-hem        the fringe along the curtain's lower edge
    --vs-aurora-sky        the night sky at the horizon
    --vs-aurora-intensity  brightness of the aurora, 1 = default
    --vs-aurora-speed      animation speed, 1 = default
    --vs-aurora-horizon    height of the lake line, 0–1 from the bottom (default .3; 0 = no lake, the sky runs
                           down to a low treeline at the bottom edge)
-->
<div class="vs-aurora" aria-hidden="true"><canvas class="vs-aurora-canvas"></canvas></div>
<style>
   
.vs-aurora {
  --vs-aurora-low: #6355f5;
  --vs-aurora-high: #b42df2;
  --vs-aurora-hem: #b42df2;
  --vs-aurora-sky: #0a1424;

  --vs-aurora-intensity: 0.4;
  --vs-aurora-speed: 1;
  --vs-aurora-horizon: .3;

  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 50% 65%,
      #f02bea40 0%,
      #b42df240 22%,
      #6355f530 45%,
      transparent 72%
    ),
    linear-gradient(
      180deg,
      #03060c 0%,
      #0a1424 50%,
      #17102d 75%,
      #020406 100%
    );
}

/* Aurora color palette */
:root {
  --aurora-pink: #f02bea;
  --aurora-purple: #b42df2;
  --aurora-indigo: #6355f5;
  --aurora-blue: #21b9f5;
}

.vs-aurora::before {
  content: "";
  position: absolute;
  inset: 0;

  background: linear-gradient(
    0deg,
    transparent 0%,
    #f02bea 30%,
    #b42df2 45%,
    #6355f5 65%,
    #21b9f5 100%
  );

  opacity: 0.18;
  filter: blur(65px);
  transform: scale(1.15);
}


    .vs-aurora-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 1.4s cubic-bezier(.16, 1, .3, 1);
    }

    .vs-aurora-ready .vs-aurora-canvas {
        opacity: 1;
    }
</style>
